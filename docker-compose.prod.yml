# =============================================================================
# DOCKER COMPOSE PRODUKSI (OPTIMASI DOMCLOUD / ROOTLESS DOCKER)
# SISTEM DETEKSI ORISINALITAS LAPORAN STITEK BONTANG
# =============================================================================

networks:
  stitek-network:
    name: stitek-internal-network
    driver: bridge

volumes:
  stitek_ai_images:
    name: stitek_ai_extracted_images
    driver: local

services:
  # ---------------------------------------------------------------------------
  # 1. LAYANAN INFERENSI AI & MULTIMODAL (FASTAPI PYTHON)
  # ---------------------------------------------------------------------------
  ai-service:
    build:
      context: ./AI-service
      dockerfile: Dockerfile
    container_name: stitek-ai-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - FASTAPI_PORT=8000
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=${DATABASE_URL}
      - TAUTAN_SUPABASE=${TAUTAN_SUPABASE}
      - KUNCI_API_SUPABASE=${KUNCI_API_SUPABASE}
      - RRF_K=${RRF_K:-60}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-25}
      - CORS_ALLOWED_ORIGINS=*
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
    volumes:
      - stitek_ai_images:/app/static/extracted_images
    networks:
      - stitek-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # 2. GERBANG API & ORKESTRASI (BUN + ELYSIAJS)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stitek-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - JWT_SECRET=${JWT_SECRET}
      - FASTAPI_SERVICE_URL=http://ai-service:8000
    depends_on:
      ai-service:
        condition: service_healthy
    networks:
      - stitek-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # 3. KLIEN WEB DASHBOARD (REACT VITE + NGINX)
  # Catatan: Port host dimapping ke 8080 (bukan 80) agar kompatibel dengan 
  # reverse proxy Nginx DOMCloud dan izin user rootless.
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BACKEND_URL: /api
    container_name: stitek-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - stitek-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
