server {
    listen 80;
    server_name localhost;

    # Kompresi Gzip untuk transmisi berkas statis berkecepatan tinggi
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json font/ttf font/woff font/woff2;
    gzip_disable "MSIE [1-6]\.";

    # Direktori root aset statis yang telah dikompilasi
    root /usr/share/nginx/html;
    index index.html index.htm;

    # 1. Routing Single Page Application (SPA Fallback ke index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Caching Header untuk aset statis berekstensi khusus (Fonts, Gambar, CSS, JS)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # 3. Reverse Proxy Terpadu ke Backend API Gateway (Bun ElysiaJS)
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Konfigurasi Kritis untuk Server-Sent Events (SSE) Live Inference Streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding off;
    }

    # Halaman galat bawaan server
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
