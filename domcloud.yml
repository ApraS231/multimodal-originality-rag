# =============================================================================
# RESEP DEPLOYMENT OTOMATIS DOMCLOUD (DOMCLOUD.YML)
# Sistem Deteksi Orisinalitas Laporan STITEK Bontang
# =============================================================================

source: https://github.com/ApraS231/multimodal-originality-rag.git
branch: main

features:
  - docker
  - ssl

nginx:
  fastcgi: "off"
  locations:
    - match: /
      proxy_pass: http://127.0.0.1:8080

commands:
  # 1. Pastikan berkas .env tersedia (jika belum ada, buat dari templat)
  - test -f .env || cp .env.example .env
  # 2. Build dan jalankan seluruh container produksi
  - docker compose -f docker-compose.prod.yml up -d --build
